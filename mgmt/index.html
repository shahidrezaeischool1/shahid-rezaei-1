<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 40px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
  }
  .login-box h1 {
    color: #fff;
    font-size: 22px;
    text-align: center;
    margin-bottom: 30px;
    font-weight: 600;
  }
  .field { margin-bottom: 18px; }
  .field label {
    display: block;
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    transition: all 0.3s;
    direction: ltr;
  }
  .field input:focus {
    outline: none;
    border-color: #4da6ff;
    background: rgba(77, 166, 255, 0.1);
    box-shadow: 0 0 0 3px rgba(77, 166, 255, 0.2);
  }
  .btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #4da6ff, #2563eb);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
    margin-top: 8px;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(77, 166, 255, 0.4);
  }
  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .error {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
    text-align: center;
  }
  .error.show { display: block; }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-left: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-box">
  <h1>🔐 ورود به پنل مدیریت</h1>

  <div class="error" id="errorBox"></div>

  <form id="loginForm">
    <div class="field">
      <label>ایمیل</label>
      <input type="email" id="email" required autocomplete="email" placeholder="email@example.com">
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn" id="loginBtn">ورود</button>
  </form>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ===== اطلاعات اتصال Supabase =====
const SUPABASE_URL = 'https://yuelptaojlwabhtrdoyp.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl1ZWxwdGFvamx3YWJodHJkb3lwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MTY3OTksImV4cCI6MjEwNTQ5Mjc5OX0.xt_TCzZeTrPtOQSftngCPuF84OtK2Rt-mO-xQHAHXpA';

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

// ===== المان‌ها =====
const form = document.getElementById('loginForm');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const errorBox = document.getElementById('errorBox');

// ===== بررسی اگه قبلاً لاگین کرده =====
const { data: { session } } = await supabase.auth.getSession();
if (session) {
  window.location.href = 'panel.html';
}

// ===== ورود =====
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('show');
  loginBtn.disabled = true;
  loginBtn.innerHTML = 'در حال ورود<span class="spinner"></span>';

  const { data, error } = await supabase.auth.signInWithPassword({
    email: emailInput.value.trim(),
    password: passwordInput.value
  });

  if (error) {
    console.error(error);
    let msg = 'خطا در ورود. لطفاً دوباره تلاش کنید.';
    if (error.message.includes('Invalid login credentials')) {
      msg = 'ایمیل یا رمز عبور اشتباه است.';
    } else if (error.message.includes('Email not confirmed')) {
      msg = 'ایمیل شما تایید نشده است.';
    } else if (error.message.includes('Invalid email')) {
      msg = 'فرمت ایمیل درست نیست.';
    } else if (error.message.includes('Too many requests')) {
      msg = 'تلاش بیش از حد. چند دقیقه صبر کنید.';
    }
    errorBox.textContent = msg;
    errorBox.classList.add('show');
    loginBtn.disabled = false;
    loginBtn.textContent = 'ورود';
    return;
  }

  // ورود موفق
  window.location.href = 'panel.html';
});
</script>

</body>
</html>
