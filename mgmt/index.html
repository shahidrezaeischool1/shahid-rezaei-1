<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود</title>
<meta name="robots" content="noindex, nofollow">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .login-box {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 40px 32px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
  }
  .login-box h1 {
    color: #fff;
    font-size: 22px;
    text-align: center;
    margin-bottom: 30px;
    font-weight: 600;
  }
  .field {
    margin-bottom: 18px;
  }
  .field label {
    display: block;
    color: #94a3b8;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    transition: all 0.3s;
    direction: ltr;
  }
  .field input:focus {
    outline: none;
    border-color: #4da6ff;
    background: rgba(77, 166, 255, 0.1);
    box-shadow: 0 0 0 3px rgba(77, 166, 255, 0.2);
  }
  .btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, #4da6ff, #2563eb);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.3s;
    margin-top: 8px;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(77, 166, 255, 0.4);
  }
  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .error {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    color: #fca5a5;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
    text-align: center;
  }
  .error.show { display: block; }
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-left: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-box">
  <h1>🔐 ورود به پنل مدیریت</h1>

  <div class="error" id="errorBox"></div>

  <form id="loginForm">
    <div class="field">
      <label>ایمیل</label>
      <input type="email" id="email" required autocomplete="email" placeholder="email@example.com">
    </div>
    <div class="field">
      <label>رمز عبور</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
    </div>
    <button type="submit" class="btn" id="loginBtn">ورود</button>
  </form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA_RTcEktXQkKmDNRK9jMGOY8ZNIiTKcGU",
  authDomain: "shahid-rezaei-1.firebaseapp.com",
  projectId: "shahid-rezaei-1",
  storageBucket: "shahid-rezaei-1.firebasestorage.app",
  messagingSenderId: "444337328544",
  appId: "1:444337328544:web:f79e0505d5ee1b86fd14c5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const form = document.getElementById('loginForm');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('loginBtn');
const errorBox = document.getElementById('errorBox');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('show');
  loginBtn.disabled = true;
  loginBtn.innerHTML = 'در حال ورود<span class="spinner"></span>';

  try {
    await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
    window.location.href = 'panel.html';
  } catch (err) {
    console.error(err);
    let msg = 'خطا در ورود. لطفاً دوباره تلاش کنید.';
    if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') {
      msg = 'ایمیل یا رمز عبور اشتباه است.';
    } else if (err.code === 'auth/invalid-email') {
      msg = 'فرمت ایمیل درست نیست.';
    } else if (err.code === 'auth/too-many-requests') {
      msg = 'تلاش بیش از حد. چند دقیقه صبر کنید.';
    }
    errorBox.textContent = msg;
    errorBox.classList.add('show');
    loginBtn.disabled = false;
    loginBtn.textContent = 'ورود';
  }
});
</script>

</body>
</html>
